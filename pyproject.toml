[project]
name = "boostcamp-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for the Boostcamp fitness platform — access your training history, programs, custom exercises, and analytics from Claude."
readme = "README.md"
authors = [
    { name = "David Caslin", email = "dcaslin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boostcampapi",
    "fastmcp>=3.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
boostcamp-mcp = "boostcamp_mcp.server:mcp.run"
login = "boostcamp_mcp.login:main"

[tool.uv]
dev-dependencies = [
    "mcp[cli]>=1.2.1",
]

[tool.uv.sources]
boostcampapi = { git = "https://github.com/dcaslin/boostcamp-api.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
